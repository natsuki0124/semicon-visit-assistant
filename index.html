<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Semicon 智慧看展指南</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-size: 17px; touch-action: manipulation; }
    .star-active { color: #f59e0b; }
    .star-inactive { color: #cbd5e1; }

    /* ===== 手機輸出 PDF / 列印專用樣式 ===== */
    @media print {
      header, #step1, #step2, #btnBackToStep2, #btnExportPDF, .no-print {
        display: none !important;
      }
      body, main {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      #step3 {
        display: block !important;
      }
      /* 防止卡片在跨頁處被腰斬切割 */
      #pdfContent > div {
        page-break-inside: avoid;
        break-inside: avoid;
        border: 1px solid #cbd5e1 !important;
        margin-bottom: 20px !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-12 antialiased">
  <header class="bg-blue-700 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <h1 class="text-xl font-bold tracking-wide">Semicon 智慧看展</h1>
      <span id="stepIndicator" class="text-xs bg-blue-800 px-2.5 py-1 rounded-full">步驟 1 / 3</span>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4">
    <!-- 步驟 1: 輸入與選取介面 -->
    <section id="step1" class="space-y-5">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <label class="block font-semibold text-lg mb-2">1. 感興趣的廠商（可輸入多家）</label>
        <p class="text-sm text-slate-500 mb-2">若有多家請用逗號「,」或換行隔開</p>
        <textarea id="vendorInput" rows="3" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-base" placeholder="例如：日月光, 台積電, ASML"></textarea>
      </div>

      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
        <label class="block font-semibold text-lg mb-2">2. 關心的技術領域</label>
        <p class="text-sm text-slate-500 mb-3">可直接點選預設標籤，或於下方輸入自訂領域：</p>
        <div class="flex flex-wrap gap-2 mb-3">
          <button type="button" class="preset-tag px-4 py-2 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 font-medium active:scale-95 transition" data-tag="先進封裝"># 先進封裝</button>
          <button type="button" class="preset-tag px-4 py-2 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 font-medium active:scale-95 transition" data-tag="矽光子"># 矽光子</button>
          <button type="button" class="preset-tag px-4 py-2 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 font-medium active:scale-95 transition" data-tag="檢測設備"># 檢測設備</button>
          <button type="button" class="preset-tag px-4 py-2 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 font-medium active:scale-95 transition" data-tag="第三代半導體"># 第三代半導體</button>
        </div>
        <input type="text" id="customTopicInput" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-base" placeholder="或手動輸入（例如：CoWoS 設備、散熱材料）" />
      </div>

      <button id="btnSearch" class="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-md text-lg active:scale-[0.98] transition">
        搜尋並分析相符廠商 →
      </button>
    </section>

    <!-- 步驟 2: 廠商評比與挑選介面 -->
    <section id="step2" class="hidden space-y-4">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-bold">推薦廠商列表 (<span id="vendorCount">0</span>)</h2>
        <div class="space-x-2">
          <button id="btnSelectAll" class="text-sm text-blue-600 font-medium px-2 py-1 bg-blue-50 rounded">全選</button>
          <button id="btnDeselectAll" class="text-sm text-slate-500 font-medium px-2 py-1 bg-slate-100 rounded">取消</button>
        </div>
      </div>
      
      <div id="vendorList" class="space-y-3">
        <!-- 動態渲染卡片 -->
      </div>

      <div class="sticky bottom-4 bg-slate-50/90 backdrop-blur p-2 pt-3 rounded-2xl flex gap-3 shadow-lg border border-slate-200">
        <button id="btnBackToStep1" class="w-1/3 py-3.5 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl text-slate-700">← 返回</button>
        <button id="btnGenerateCards" class="w-2/3 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow">產生 Visit Cards →</button>
      </div>
    </section>

    <!-- 步驟 3: Visit Cards 與 PDF 輸出介面 -->
    <section id="step3" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold">已安排參訪清單</h2>
          <p class="text-xs text-slate-500">已依攤位編號字母自動排序</p>
        </div>
        <button id="btnExportPDF" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow flex items-center gap-1.5 text-base active:scale-95 transition">
          📄 輸出 PDF
        </button>
      </div>

      <div id="pdfContent" class="space-y-4">
        <!-- 動態渲染 Visit Card -->
      </div>

      <button id="btnBackToStep2" class="w-full py-3.5 bg-slate-200 hover:bg-slate-300 font-bold rounded-xl text-slate-700 mt-4">
        ← 回到挑選列表修改
      </button>
    </section>
  </main>

  <!-- 讀取 Modal -->
  <div id="loadingModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl flex flex-col items-center max-w-xs text-center space-y-3">
      <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p id="loadingText" class="font-bold text-base text-slate-800">AI 正在深度分析中...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
